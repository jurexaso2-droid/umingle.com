<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmeTV Clone · Random Chat</title>
  <style>
    /* ---------- GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0e0e10;
      color: #efeff1;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---------- TOP BAR ---------- */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #18181b;
      border-bottom: 1px solid #2d2d35;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #9147ff, #6441a5);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .top-actions {
      display: flex;
      gap: 10px;
    }
    .top-btn {
      background: #2d2d35;
      border: none;
      color: #efeff1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .top-btn:hover {
      background: #3d3d4a;
    }

    /* ---------- MAIN LAYOUT ---------- */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---------- VIDEO AREA ---------- */
    .video-area {
      flex: 1;
      position: relative;
      background: #0a0a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-feed {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.4s;
    }
    .video-feed.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 50%);
      pointer-events: none;
    }
    .participant-info {
      position: absolute;
      bottom: 100px;
      left: 24px;
      z-index: 5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .participant-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* ---------- LOADING OVERLAY ---------- */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,10,12,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 20px;
      backdrop-filter: blur(6px);
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #9147ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 15px;
      color: #b0b0b8;
    }

    /* ---------- SELF PREVIEW (top-left) ---------- */
    .self-preview {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 160px;
      height: 120px;
      background: #1a1a1f;
      border-radius: 12px;
      border: 2px solid #2d2d35;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .self-preview .placeholder {
      font-size: 12px;
      color: #5a5a66;
      text-align: center;
      line-height: 1.4;
    }
    .self-preview .cam-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    /* ---------- CONTROLS ---------- */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 15;
    }
    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #2d2d35;
      color: #efeff1;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .ctrl-btn:hover {
      background: #3d3d4a;
      transform: scale(1.05);
    }
    .ctrl-btn.primary {
      width: 64px;
      height: 64px;
      background: #9147ff;
      font-size: 22px;
    }
    .ctrl-btn.primary:hover {
      background: #a970ff;
    }
    .ctrl-btn.danger {
      background: #e91916;
    }
    .ctrl-btn.danger:hover {
      background: #ff3b3b;
    }
    .ctrl-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ---------- CHAT SIDEBAR ---------- */
    .chat-sidebar {
      width: 320px;
      background: #18181b;
      border-left: 1px solid #2d2d35;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chat-header {
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #2d2d35;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header .status {
      font-size: 11px;
      color: #00b85c;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-header .status::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #00b85c;
      border-radius: 50%;
      display: inline-block;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #3d3d4a;
      border-radius: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.them {
      background: #2d2d35;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }
    .msg.me {
      background: #9147ff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .msg.system {
      background: transparent;
      color: #5a5a66;
      font-size: 11px;
      text-align: center;
      align-self: center;
      max-width: 100%;
      padding: 4px 0;
    }
    .chat-input-area {
      padding: 12px 14px;
      border-top: 1px solid #2d2d35;
      display: flex;
      gap: 8px;
    }
    .chat-input-area input {
      flex: 1;
      background: #0e0e10;
      border: 1px solid #2d2d35;
      border-radius: 8px;
      padding: 9px 12px;
      color: #efeff1;
      font-size: 13px;
      outline: none;
      transition: border 0.15s;
    }
    .chat-input-area input:focus {
      border-color: #9147ff;
    }
    .chat-input-area input::placeholder {
      color: #5a5a66;
    }
    .chat-input-area button {
      background: #9147ff;
      border: none;
      color: white;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chat-input-area button:hover {
      background: #a970ff;
    }

    /* ---------- START SCREEN ---------- */
    .start-screen {
      position: absolute;
      inset: 0;
      background: #0e0e10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 24px;
      transition: opacity 0.4s;
    }
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-screen h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #9147ff, #e91916);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .start-screen p {
      color: #b0b0b8;
      font-size: 15px;
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
    }
    .start-btn {
      background: #9147ff;
      border: none;
      color: white;
      padding: 14px 48px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(145,71,255,0.3);
    }
    .start-btn:hover {
      background: #a970ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(145,71,255,0.45);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .chat-sidebar {
        width: 260px;
      }
    }
    @media (max-width: 700px) {
      .chat-sidebar {
        display: none;
      }
      .self-preview {
        top: 16px;
        left: 16px;
        width: 100px;
        height: 75px;
      }
      .self-preview .placeholder {
        font-size: 10px;
      }
      .self-preview .cam-icon {
        font-size: 18px;
      }
      .participant-info {
        bottom: 80px;
        left: 16px;
      }
      .participant-name {
        font-size: 16px;
      }
      .controls {
        bottom: 16px;
      }
      .ctrl-btn {
        width: 44px;
        height: 44px;
        font-size: 17px;
      }
      .ctrl-btn.primary {
        width: 54px;
        height: 54px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon">🎥</div>
      <span>OmeTV</span>
    </div>
    <div class="top-actions">
      <button class="top-btn" id="reportBtn">⚑ Report</button>
      <button class="top-btn" id="stopBtnTop">✕ Stop</button>
    </div>
  </div>

  <!-- ========== MAIN ========== -->
  <div class="main-container">

    <!-- VIDEO AREA -->
    <div class="video-area">
      <!-- Remote video feed (thumbnail) -->
      <div class="video-feed hidden" id="videoFeed"></div>
      <div class="video-overlay"></div>

      <!-- Participant info (name only) -->
      <div class="participant-info" id="participantInfo" style="display: none;">
        <div class="participant-name" id="participantName">—</div>
      </div>

      <!-- Self preview (top-left) -->
      <div class="self-preview">
        <div class="placeholder">
          <div class="cam-icon">📷</div>
          Your camera
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn" id="stopBtn" title="Stop">✕</button>
        <button class="ctrl-btn primary" id="nextBtn" title="Next">⏭</button>
        <button class="ctrl-btn" id="reportBtn2" title="Report">⚑</button>
      </div>

      <!-- Loading overlay -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Connecting to a random stranger…</div>
      </div>

      <!-- Start screen -->
      <div class="start-screen" id="startScreen">
        <h1>OmeTV</h1>
        <p>Talk to strangers from around the world. Tap <strong>Start</strong> to begin a random video chat.</p>
        <button class="start-btn" id="startBtn">Start Chatting</button>
      </div>
    </div>

    <!-- CHAT SIDEBAR -->
    <div class="chat-sidebar">
      <div class="chat-header">
        <span>Live Chat</span>
        <span class="status" id="chatStatus">Connected</span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="msg system">Chat messages will appear here</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message…" autocomplete="off">
        <button id="sendBtn">➤</button>
      </div>
    </div>

  </div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      //  CONFIG
      // ============================================================
      const API_BASE = 'https://betadash-api-swordslush-production.up.railway.app/pinayvirgin';
      const PAGE_LIMIT = 30;

      // ============================================================
      //  STATE
      // ============================================================
      let state = {
        page: 1,
        totalPages: 1,
        hasMore: true,
        results: [],
        currentIndex: -1,
        isFetching: false,
        isActive: false,
      };

      // ============================================================
      //  DOM REFS
      // ============================================================
      const $ = (sel) => document.querySelector(sel);
      const videoFeed = $('#videoFeed');
      const participantInfo = $('#participantInfo');
      const participantName = $('#participantName');
      const loadingOverlay = $('#loadingOverlay');
      const loadingText = $('#loadingText');
      const startScreen = $('#startScreen');
      const chatMessages = $('#chatMessages');
      const chatInput = $('#chatInput');
      const chatStatus = $('#chatStatus');
      const nextBtn = $('#nextBtn');
      const stopBtn = $('#stopBtn');
      const stopBtnTop = $('#stopBtnTop');
      const reportBtn = $('#reportBtn');
      const reportBtn2 = $('#reportBtn2');
      const startBtn = $('#startBtn');
      const sendBtn = $('#sendBtn');

      // ============================================================
      //  HELPERS
      // ============================================================
      function showLoading(text) {
        loadingText.textContent = text || 'Connecting to a random stranger…';
        loadingOverlay.classList.remove('hidden');
      }

      function hideLoading() {
        loadingOverlay.classList.add('hidden');
      }

      function showVideo() {
        videoFeed.classList.remove('hidden');
      }

      function hideVideo() {
        videoFeed.classList.add('hidden');
      }

      function addChatMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function clearChat() {
        chatMessages.innerHTML = '';
      }

      function setChatStatus(online) {
        chatStatus.textContent = online ? 'Connected' : 'Disconnected';
        chatStatus.style.color = online ? '#00b85c' : '#e91916';
      }

      function randomDelay(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      // ============================================================
      //  API FETCH
      // ============================================================
      async function fetchPage(page) {
        const url = `${API_BASE}?page=${page}&limit=${PAGE_LIMIT}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return {
          results: data.results || [],
          totalPages: data.totalPages || 1,
          hasMore: data.hasMore !== false,
        };
      }

      // ============================================================
      //  LOAD NEXT PARTICIPANT
      // ============================================================
      async function loadNextParticipant() {
        if (state.isFetching) return;
        state.isFetching = true;
        nextBtn.disabled = true;

        try {
          // If no results loaded yet, or we've reached the end of the current batch
          if (state.results.length === 0 || state.currentIndex >= state.results.length - 1) {
            // Determine next page
            let nextPage = state.page + 1;
            if (!state.hasMore || nextPage > state.totalPages) {
              nextPage = 1; // loop back to first page
            }

            showLoading('Finding someone new…');
            const data = await fetchPage(nextPage);
            state.results = data.results;
            state.page = nextPage;
            state.totalPages = data.totalPages;
            state.hasMore = data.hasMore;
            state.currentIndex = -1;

            if (state.results.length === 0) {
              showLoading('No participants found. Retrying…');
              await new Promise(r => setTimeout(r, 1500));
              state.isFetching = false;
              nextBtn.disabled = false;
              loadNextParticipant();
              return;
            }
          }

          // Advance index
          state.currentIndex++;

          // Simulate connection delay
          const delay = randomDelay(800, 2200);
          showLoading('Connecting to a random stranger…');
          await new Promise(r => setTimeout(r, delay));

          const participant = state.results[state.currentIndex];

          // Update video feed
          if (participant.thumbnail) {
            const img = new Image();
            img.onload = () => {
              videoFeed.style.backgroundImage = `url('${participant.thumbnail}')`;
              showVideo();
            };
            img.onerror = () => {
              videoFeed.style.backgroundImage = 'linear-gradient(135deg, #1a1a2e, #16213e)';
              showVideo();
            };
            img.src = participant.thumbnail;
          } else {
            videoFeed.style.backgroundImage = 'linear-gradient(135deg, #1a1a2e, #16213e)';
            showVideo();
          }

          // Update participant info — name only (no categories/tags)
          participantName.textContent = participant.title || 'Stranger';
          participantInfo.style.display = 'block';

          hideLoading();
          setChatStatus(true);

          // Simulated chat messages from the stranger
          clearChat();
          addChatMessage('You are now connected', 'system');
          const greetings = [
            'Hey there! 👋',
            'Hi! How are you?',
            'Hello! Nice to meet you.',
            'Hey! Where are you from?',
            'Hi! What\'s up?',
          ];
          const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
          setTimeout(() => {
            addChatMessage(randomGreeting, 'them');
          }, randomDelay(600, 1500));

        } catch (err) {
          console.error('Fetch error:', err);
          showLoading('Connection failed. Retrying…');
          await new Promise(r => setTimeout(r, 2000));
          hideLoading();
          addChatMessage('Connection error. Please try again.', 'system');
        } finally {
          state.isFetching = false;
          nextBtn.disabled = false;
        }
      }

      // ============================================================
      //  START
      // ============================================================
      async function startChat() {
        state.isActive = true;
        startScreen.classList.add('hidden');
        clearChat();
        setChatStatus(true);
        addChatMessage('Looking for someone…', 'system');
        state.results = [];
        state.currentIndex = -1;
        state.page = 1;
        state.hasMore = true;
        await loadNextParticipant();
      }

      // ============================================================
      //  STOP
      // ============================================================
      function stopChat() {
        state.isActive = false;
        state.isFetching = false;
        state.results = [];
        state.currentIndex = -1;
        hideVideo();
        hideLoading();
        participantInfo.style.display = 'none';
        setChatStatus(false);
        clearChat();
        addChatMessage('Chat stopped.', 'system');
        startScreen.classList.remove('hidden');
        nextBtn.disabled = false;
      }

      // ============================================================
      //  REPORT
      // ============================================================
      function reportUser() {
        addChatMessage('User reported. Thank you.', 'system');
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = '✓ Reported';
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = '⚑ Report';
        }, 3000);
      }

      // ============================================================
      //  SEND MESSAGE
      // ============================================================
      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        addChatMessage(text, 'me');
        chatInput.value = '';

        if (state.isActive && state.currentIndex >= 0) {
          const replies = [
            'Nice!',
            'Haha 😄',
            'Really?',
            'That\'s cool.',
            'Tell me more!',
            'I see.',
            'Interesting…',
            '😂😂',
          ];
          const reply = replies[Math.floor(Math.random() * replies.length)];
          setTimeout(() => {
            addChatMessage(reply, 'them');
          }, randomDelay(800, 2000));
        }
      }

      // ============================================================
      //  EVENT LISTENERS
      // ============================================================
      startBtn.addEventListener('click', startChat);
      nextBtn.addEventListener('click', loadNextParticipant);
      stopBtn.addEventListener('click', stopChat);
      stopBtnTop.addEventListener('click', stopChat);
      reportBtn.addEventListener('click', reportUser);
      reportBtn2.addEventListener('click', reportUser);
      sendBtn.addEventListener('click', sendMessage);
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'n' || e.key === 'N') {
          if (state.isActive && !state.isFetching) {
            e.preventDefault();
            loadNextParticipant();
          }
        }
      });

      console.log('OmeTV clone ready. API:', API_BASE);
    })();
  </script>
</body>
</html>
